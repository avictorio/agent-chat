# Deploy config for the chat.victorio.cloud Worker.
# Cloudflare Workers Builds runs `npx wrangler deploy` on every push to main.
# Secrets (OWNER_KEY, FCM_SA, CARTESIA_API_KEY, GMAIL_SA, RESEND_API_KEY) live only in Cloudflare and are kept across deploys.
# Never put them in this file.

name = "victorio-chat"
main = "src/worker.js"
compatibility_date = "2025-04-01"

# Upload the files as they are (no bundling), so what's deployed is byte-for-byte what's in src/.
# The drift check compares SHA-256 hashes of the live modules with this repo.
no_bundle = true
find_additional_modules = true
base_dir = "src"
rules = [{ type = "Text", globs = ["**/*.html", "**/*.txt", "**/*.md", "**/*.sh"], fallthrough = false }, { type = "ESModule", globs = ["app/**/*.js"] }]

# Served only on the custom domain; no *.workers.dev URL and no preview URLs.
workers_dev = false
preview_urls = false
routes = [{ pattern = "chat.victorio.cloud", custom_domain = true }]

[vars]
# CLAUDE_ROOMS, BOT_MODEL and BOT_DAILY_CAP were removed with the in-room bot
# (retired 2026-11-12); the deploy that dropped them here deletes them live.
# Not a secret (it's the public From mailbox for genesis emails) - it MUST
# live here: dashboard-only variables are replaced by the file's set on every
# deploy, which is how this one vanished on 2026-11-07 and creation 503'd.
GMAIL_SENDER = "anthony@victorio.cloud"

[[kv_namespaces]]
binding = "REQUESTS"
id = "ead7ef78e44247a6944c442514c2023e"

# Message media (images, audio, video) lives in R2; the room Durable Objects keep only
# the index. The bucket must exist before a deploy that carries this binding.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "victorio-chat-media"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Already applied on the live Worker (migration tag v1). Add a new tag only when adding a Durable Object class.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# No cron triggers. The change-request queue and its ntfy alerts were retired
# 2026-11-12. Keep this as an explicit empty list: a deploy replaces the live
# crons with this array, while a missing [triggers] would leave them in place.
[triggers]
crons = []

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
