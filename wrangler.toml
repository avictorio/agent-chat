# Deploy config for the chat.victorio.cloud Worker.
# Cloudflare Workers Builds runs on every push to main: the build command
# (`npm ci --prefix web && npm run build --prefix web`) builds the web app
# into web/app/dist, then `npx wrangler deploy` uploads the Worker with it.
# Secrets (OWNER_KEY, CARTESIA_API_KEY, GMAIL_SA, RESEND_API_KEY, ANTHROPIC_API_KEY, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) live only in Cloudflare and are kept across deploys.
# Never put them in this file.

name = "victorio-chat"
main = "worker/index.ts"
compatibility_date = "2025-04-01"

# Wrangler bundles the Worker at deploy (inside the Workers Builds run): its
# esbuild follows the imports from main, so the repo is the source of truth
# and the live script is a build of it. Source maps go up with it, so a
# production stack trace names the repo's file and line. Text modules (word
# lists, docs, the agent recipe) come in through the rule below; fallthrough
# keeps wrangler's default rules too.
upload_source_maps = true
rules = [{ type = "Text", globs = ["**/*.txt", "**/*.md", "**/*.sh"], fallthrough = true }]

# Served only on the custom domain; no *.workers.dev URL and no preview URLs.
workers_dev = false
preview_urls = false
routes = [{ pattern = "chat.victorio.cloud", custom_domain = true }]

# The web app (web/, built by Vite) as Workers Static Assets. Cloudflare
# answers the files that exist itself: the hashed /assets/* (a one-year
# immutable cache from web/app/public/_headers) and the app icons /icons/*
# (a day). The Worker runs first on its own paths below, so it owns the API,
# the page routes and the build-id stamp, and reads index.html through the
# ASSETS binding ("/index.html" is listed so the raw, unstamped file is never
# served). Every other path the asset server cannot answer falls through to
# the Worker, whose 404 is not cached. The paths are listed instead of "/*"
# with "!/assets/*" because a negative pattern sends the request to the asset
# server with no fall-through: its 404 for a missing hashed file carried the
# _headers one-year immutable cache, and a browser that asked for a chunk
# the serving build lacked (during a deploy or a rollback) kept that 404
# after the file came back.
[assets]
directory = "web/app/dist"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/api*", "/r/*", "/llms.txt", "/emoji.json", "/manifest.webmanifest", "/sw.js"]
html_handling = "none"
not_found_handling = "none"

[vars]
# CLAUDE_ROOMS, BOT_MODEL and BOT_DAILY_CAP were removed with the in-room bot
# (retired 2026-11-12); the deploy that dropped them here deletes them live.
# Not a secret (it's the public From mailbox for genesis emails) - it MUST
# live here: dashboard-only variables are replaced by the file's set on every
# deploy, which is how this one vanished on 2026-11-07 and creation 503'd.
GMAIL_SENDER = "anthony@victorio.cloud"
# Direct uploads (Phase 2, 2026-11-20): where upload parts go straight to R2
# with presigned URLs. Not secrets - the R2 API credential that each
# upload's own signing credential is derived from is (R2_ACCESS_KEY_ID /
# R2_SECRET_ACCESS_KEY, dashboard Secrets only).
# R2_DIRECT = "1" turns direct uploads on for every client that asks; until
# then only an owner request with "direct": "force" uses them (to test live).
R2_ACCOUNT_ID = "cb8c005173d35ee12adb292521a88eae"
R2_BUCKET = "victorio-chat-media"
# On 2026-11-20, after a live owner-only test (signed parts, CORS, ListParts,
# completion through the binding, a byte-exact download).
R2_DIRECT = "1"

[[kv_namespaces]]
binding = "REQUESTS"
id = "ead7ef78e44247a6944c442514c2023e"

# Message media and uploads (images, audio, video, files, pages, docs), avatars,
# voice samples and Sketch & Guess drawings live in R2; the room Durable Objects keep only
# the index. The bucket must exist before a deploy that carries this binding.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "victorio-chat-media"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Muse delivery hooks (worker/room/muse.ts) push wakes to the muse-bridge
# Worker through this service binding. It stays commented out until that
# Worker is deployed: a deploy that declares a binding to a Worker the
# account does not have fails outright. Until then MUSE_BRIDGE is absent,
# POST /api/muse/hooks answers 503 and no hook can be registered. To turn
# it on, deploy muse-bridge first, set the MUSE_BRIDGE_KEY secret (the
# bridge's BRIDGE_SHARED_KEY), then uncomment these lines. The API suite
# adds the binding itself, with a stand-in bridge (tests/api/server.js).
# [[services]]
# binding = "MUSE_BRIDGE"
# service = "muse-bridge"

# Already applied on the live Worker (migration tag v1). Add a new tag only when adding a Durable Object class.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# No cron triggers. The change-request queue and its ntfy alerts were retired
# 2026-11-12. Keep this as an explicit empty list: a deploy replaces the live
# crons with this array, while a missing [triggers] would leave them in place.
[triggers]
crons = []

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
